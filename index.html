<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ESP32 Control Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
        }

        body {
            background: linear-gradient(135deg, #1a0000 0%, #2d0a0a 100%);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            position: fixed;
        }

        .container {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 10px;
            padding: 10px;
            height: 100vh;
            width: 100vw;
        }

        .left-section {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .sensor-panel {
            background: linear-gradient(145deg, #1a1a1a, #0d0d0d);
            border: 2px solid #ff3333;
            border-radius: 12px;
            padding: 12px;
            box-shadow: 0 4px 20px rgba(255, 51, 51, 0.3);
        }

        .panel-title {
            color: #ff3333;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .sensor-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .sensor-box {
            background: rgba(40, 20, 20, 0.6);
            border: 1px solid #ff3333;
            border-radius: 8px;
            padding: 8px;
        }

        .sensor-label {
            color: #ff6666;
            font-size: 11px;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .sensor-value {
            color: #ff3333;
            font-size: 20px;
            font-weight: bold;
        }

        .camera-display {
            background: linear-gradient(145deg, #1a1a1a, #0d0d0d);
            border: 2px dashed #ff3333;
            border-radius: 12px;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(255, 51, 51, 0.3);
            position: relative;
            overflow: hidden;
        }

        .camera-text {
            color: #ff3333;
            font-size: 18px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .right-section {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .control-panel {
            background: linear-gradient(145deg, #1a1a1a, #0d0d0d);
            border: 2px solid #ff3333;
            border-radius: 12px;
            padding: 12px;
            box-shadow: 0 4px 20px rgba(255, 51, 51, 0.3);
        }

        .rotation-control {
            margin-bottom: 15px;
        }

        .slider-container {
            position: relative;
            width: 100%;
            height: 50px;
            margin-top: 8px;
        }

        .slider-track {
            position: absolute;
            width: 100%;
            height: 40px;
            background: #ff3333;
            border-radius: 20px;
            top: 5px;
        }

        .slider-knob {
            position: absolute;
            width: 50px;
            height: 50px;
            background: radial-gradient(circle, #ff6666, #ff3333);
            border-radius: 50%;
            border: 3px solid #330000;
            box-shadow: 0 4px 15px rgba(255, 51, 51, 0.6);
            cursor: grab;
            transition: transform 0.1s ease;
            left: 50%;
            transform: translateX(-50%);
        }

        .slider-knob:active {
            cursor: grabbing;
            transform: translateX(-50%) scale(1.1);
        }

        .rotation-label {
            color: #ff6666;
            font-size: 12px;
            text-align: center;
            margin-top: 5px;
        }

        .joystick-control {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .joystick-title {
            color: #ff3333;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .joystick-container {
            position: relative;
            width: 200px;
            height: 200px;
        }

        .joystick-outer {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 3px solid #ff3333;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 51, 51, 0.1), transparent);
        }

        .joystick-inner {
            position: absolute;
            width: 60%;
            height: 60%;
            border: 2px dashed #ff3333;
            border-radius: 50%;
            top: 20%;
            left: 20%;
            opacity: 0.5;
        }

        .joystick-stick {
            position: absolute;
            width: 60px;
            height: 60px;
            background: radial-gradient(circle, #ff6666, #ff3333);
            border-radius: 50%;
            border: 3px solid #330000;
            box-shadow: 0 4px 20px rgba(255, 51, 51, 0.8);
            cursor: grab;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            transition: transform 0.1s ease;
        }

        .joystick-stick:active {
            cursor: grabbing;
            transform: translate(-50%, -50%) scale(1.1);
        }

        .joystick-values {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }

        .joystick-value {
            color: #ff3333;
            font-size: 14px;
            font-weight: bold;
        }

        .joystick-value span {
            color: #ff6666;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="left-section">
            <div class="sensor-panel">
                <div class="panel-title">Ultrasonic Sensor Data</div>
                <div class="sensor-grid">
                    <div class="sensor-box">
                        <div class="sensor-label">Front</div>
                        <div class="sensor-value">-- cm</div>
                    </div>
                    <div class="sensor-box">
                        <div class="sensor-label">Back</div>
                        <div class="sensor-value">-- cm</div>
                    </div>
                    <div class="sensor-box">
                        <div class="sensor-label">Left</div>
                        <div class="sensor-value">-- cm</div>
                    </div>
                    <div class="sensor-box">
                        <div class="sensor-label">Right</div>
                        <div class="sensor-value">-- cm</div>
                    </div>
                </div>
            </div>
            
            <div class="camera-display">
                <div class="camera-text">ESP32-CAM Display</div>
            </div>
        </div>

        <div class="right-section">
            <div class="control-panel rotation-control">
                <div class="panel-title">Cam Rotation 180°</div>
                <div class="slider-container">
                    <div class="slider-track"></div>
                    <div class="slider-knob" id="sliderKnob"></div>
                </div>
                <div class="rotation-label" id="rotationValue">0°</div>
            </div>

            <div class="control-panel joystick-control">
                <div class="joystick-title">Joystick</div>
                <div class="joystick-container">
                    <div class="joystick-outer"></div>
                    <div class="joystick-inner"></div>
                    <div class="joystick-stick" id="joystickStick"></div>
                </div>
                <div class="joystick-values">
                    <div class="joystick-value"><span>X:</span> <span id="xValue">0</span></div>
                    <div class="joystick-value"><span>Y:</span> <span id="yValue">0</span></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Slider control
        const sliderKnob = document.getElementById('sliderKnob');
        const sliderTrack = sliderKnob.parentElement;
        const rotationValue = document.getElementById('rotationValue');
        let isDraggingSlider = false;

        function updateSliderPosition(clientX) {
            const rect = sliderTrack.getBoundingClientRect();
            const knobWidth = sliderKnob.offsetWidth;
            let x = clientX - rect.left - knobWidth / 2;
            
            x = Math.max(0, Math.min(x, rect.width - knobWidth));
            
            const percentage = x / (rect.width - knobWidth);
            const rotation = Math.round(percentage * 180);
            
            sliderKnob.style.left = `${x}px`;
            sliderKnob.style.transform = 'none';
            rotationValue.textContent = `${rotation}°`;
        }

        sliderKnob.addEventListener('mousedown', () => isDraggingSlider = true);
        sliderKnob.addEventListener('touchstart', (e) => {
            isDraggingSlider = true;
            e.preventDefault();
        });

        document.addEventListener('mousemove', (e) => {
            if (isDraggingSlider) updateSliderPosition(e.clientX);
        });

        document.addEventListener('touchmove', (e) => {
            if (isDraggingSlider) {
                updateSliderPosition(e.touches[0].clientX);
                e.preventDefault();
            }
        });

        document.addEventListener('mouseup', () => isDraggingSlider = false);
        document.addEventListener('touchend', () => isDraggingSlider = false);

        // Joystick control
        const joystickStick = document.getElementById('joystickStick');
        const joystickContainer = joystickStick.parentElement;
        const xValue = document.getElementById('xValue');
        const yValue = document.getElementById('yValue');
        let isDraggingJoystick = false;

        function updateJoystickPosition(clientX, clientY) {
            const rect = joystickContainer.getBoundingClientRect();
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            const maxRadius = rect.width / 2 - 30;

            let x = clientX - rect.left - centerX;
            let y = clientY - rect.top - centerY;

            const distance = Math.sqrt(x * x + y * y);
            
            if (distance > maxRadius) {
                const angle = Math.atan2(y, x);
                x = maxRadius * Math.cos(angle);
                y = maxRadius * Math.sin(angle);
            }

            joystickStick.style.left = `${centerX + x}px`;
            joystickStick.style.top = `${centerY + y}px`;
            joystickStick.style.transform = 'translate(-50%, -50%)';

            const xPercent = Math.round((x / maxRadius) * 100);
            const yPercent = Math.round((-y / maxRadius) * 100);
            
            xValue.textContent = xPercent;
            yValue.textContent = yPercent;
        }

        function resetJoystick() {
            joystickStick.style.left = '50%';
            joystickStick.style.top = '50%';
            joystickStick.style.transform = 'translate(-50%, -50%)';
            xValue.textContent = '0';
            yValue.textContent = '0';
        }

        joystickStick.addEventListener('mousedown', () => isDraggingJoystick = true);
        joystickStick.addEventListener('touchstart', (e) => {
            isDraggingJoystick = true;
            e.preventDefault();
        });

        document.addEventListener('mousemove', (e) => {
            if (isDraggingJoystick) updateJoystickPosition(e.clientX, e.clientY);
        });

        document.addEventListener('touchmove', (e) => {
            if (isDraggingJoystick) {
                updateJoystickPosition(e.touches[0].clientX, e.touches[0].clientY);
                e.preventDefault();
            }
        });

        document.addEventListener('mouseup', () => {
            if (isDraggingJoystick) {
                isDraggingJoystick = false;
                resetJoystick();
            }
        });

        document.addEventListener('touchend', () => {
            if (isDraggingJoystick) {
                isDraggingJoystick = false;
                resetJoystick();
            }
        });

        // Prevent default touch behaviors
        document.addEventListener('touchmove', (e) => {
            if (isDraggingSlider || isDraggingJoystick) {
                e.preventDefault();
            }
        }, { passive: false });
    </script>
</body>
</html>
