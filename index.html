<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- iPhone landscape lock -->
    <meta name="viewport"
          content="width=device-height, height=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">

    <title>ESP32-CAM Controller</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a0000, #330000, #000000);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* FULL SCREEN APP */
        .app-wrapper {
            width: 100vw;
            height: 100vh;
            padding: env(safe-area-inset-top)
                     env(safe-area-inset-right)
                     env(safe-area-inset-bottom)
                     env(safe-area-inset-left);
        }

        .container {
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 16px;
        }

        .card {
            background: rgba(20, 20, 20, 0.95);
            border-radius: 18px;
            padding: 16px;
            border: 1px solid rgba(255, 51, 51, 0.2);
        }

        h2, h3 {
            color: #ff3333;
        }

        .sensor-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .sensor-item {
            background: rgba(255, 51, 51, 0.1);
            padding: 8px;
            border-radius: 10px;
            border-left: 4px solid #ff3333;
        }

        .sensor-label {
            font-size: 11px;
            color: #ffcccc;
        }

        .sensor-value {
            font-size: 20px;
            font-weight: bold;
            color: #ff3333;
        }

        .cam-display {
            flex: 1;
            background: #111;
            border: 2px dashed #ff3333;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ff3333;
            font-size: 22px;
            border-radius: 15px;
        }

        .controls-section {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .rotation-track {
            height: 50px;
            background: linear-gradient(to right, #ff0000, #330000, #ff0000);
            border-radius: 30px;
            position: relative;
        }

        .rotation-handle {
            width: 44px;
            height: 44px;
            background: #ff3333;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .joystick-container {
            width: 160px;
            height: 160px;
            margin: auto;
        }

        .joystick-base {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: #111;
            position: relative;
        }

        .joystick-stick {
            width: 60px;
            height: 60px;
            background: #ff3333;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        /* FORCE LANDSCAPE */
        @media screen and (orientation: portrait) {
            body {
                transform: rotate(90deg);
                transform-origin: center;
                width: 100vh;
                height: 100vw;
            }
        }
    </style>
</head>

<body>
<div class="app-wrapper">
    <div class="container">

        <div style="display:flex; flex-direction:column; gap:16px;">
            <div class="card">
                <h2>Ultrasonic Sensor Data</h2>
                <div class="sensor-grid">
                    <div class="sensor-item"><div class="sensor-label">Front</div><div class="sensor-value">-- cm</div></div>
                    <div class="sensor-item"><div class="sensor-label">Back</div><div class="sensor-value">-- cm</div></div>
                    <div class="sensor-item"><div class="sensor-label">Left</div><div class="sensor-value">-- cm</div></div>
                    <div class="sensor-item"><div class="sensor-label">Right</div><div class="sensor-value">-- cm</div></div>
                </div>
            </div>

            <div class="card cam-display">
                ESP32-CAM Display
            </div>
        </div>

        <div class="card controls-section">
            <div>
                <h3>Cam Rotation</h3>
                <div class="rotation-track">
                    <div class="rotation-handle"></div>
                </div>
            </div>

            <div>
                <h3>Joystick</h3>
                <div class="joystick-container">
                    <div class="joystick-base">
                        <div class="joystick-stick"></div>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>
</body>
</html>
