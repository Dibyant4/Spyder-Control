<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- Force desktop-style rendering on mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="ESP32 CAM">

    <title>ESP32-CAM Controller</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a0000 0%, #330000 50%, #000000 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: auto;
        }

        .container {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            max-width: 1400px;
            width: 100%;
            max-height: 90vh;
            min-width: 1200px; /* force horizontal layout */
        }

        .card {
            background: rgba(20, 20, 20, 0.95);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 20px 60px rgba(255, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 0, 0, 0.2);
        }

        .sensor-card {
            background: rgba(10, 10, 10, 0.98);
            color: white;
        }

        h2 {
            font-size: 20px;
            margin-bottom: 15px;
            font-weight: 600;
            color: #ff3333;
        }

        .sensor-card h2 {
            border-bottom: 2px solid #ff3333;
            padding-bottom: 10px;
        }

        .sensor-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .sensor-item {
            background: rgba(255, 51, 51, 0.1);
            padding: 10px;
            border-radius: 10px;
            border-left: 4px solid #ff3333;
        }

        .sensor-label {
            font-size: 11px;
            text-transform: uppercase;
            opacity: 0.7;
            color: #ffcccc;
        }

        .sensor-value {
            font-size: 22px;
            font-weight: 700;
            color: #ff3333;
        }

        .cam-display {
            background: linear-gradient(135deg, #0a0a0a, #1a1a1a);
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #ff3333;
            font-weight: 600;
            border: 2px dashed #ff3333;
        }

        .controls-section {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .control-group {
            text-align: center;
        }

        .control-group h3 {
            font-size: 16px;
            margin-bottom: 15px;
            color: #ff3333;
        }

        .rotation-track {
            width: 100%;
            height: 60px;
            background: linear-gradient(to right, #ff0000, #330000, #ff0000);
            border-radius: 30px;
            position: relative;
            border: 2px solid rgba(255, 51, 51, 0.3);
        }

        .rotation-handle {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #ff3333, #ff6666);
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            cursor: grab;
            border: 3px solid #000;
        }

        .rotation-value {
            margin-top: 10px;
            font-size: 18px;
            font-weight: 600;
            color: #ff3333;
        }

        .joystick-container {
            width: 200px;
            height: 200px;
            margin: auto;
        }

        .joystick-base {
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #1a1a1a, #0a0a0a);
            border-radius: 50%;
            position: relative;
            border: 5px solid rgba(255, 51, 51, 0.3);
        }

        .joystick-stick {
            width: 75px;
            height: 75px;
            background: linear-gradient(135deg, #ff3333, #ff6666);
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            cursor: grab;
            border: 5px solid #000;
        }

        .joystick-values {
            margin-top: 15px;
            color: #ff3333;
            font-weight: 600;
        }
    </style>
</head>

<body>
<div class="container">

    <div style="display:flex; flex-direction:column; gap:20px;">
        <div class="card sensor-card">
            <h2>Ultrasonic Sensor Data</h2>
            <div class="sensor-grid">
                <div class="sensor-item"><div class="sensor-label">Front</div><div class="sensor-value">-- cm</div></div>
                <div class="sensor-item"><div class="sensor-label">Back</div><div class="sensor-value">-- cm</div></div>
                <div class="sensor-item"><div class="sensor-label">Left</div><div class="sensor-value">-- cm</div></div>
                <div class="sensor-item"><div class="sensor-label">Right</div><div class="sensor-value">-- cm</div></div>
            </div>
        </div>

        <div class="card cam-display">
            ESP32-CAM Display
        </div>
    </div>

    <div class="card controls-section">
        <div class="control-group">
            <h3>Cam Rotation 180°</h3>
            <div class="rotation-track">
                <div class="rotation-handle"></div>
            </div>
            <div class="rotation-value">0°</div>
        </div>

        <div class="control-group">
            <h3>Joystick</h3>
            <div class="joystick-container">
                <div class="joystick-base">
                    <div class="joystick-stick"></div>
                </div>
            </div>
            <div class="joystick-values">X: 0 | Y: 0</div>
        </div>
    </div>

</div>
</body>
</html>
